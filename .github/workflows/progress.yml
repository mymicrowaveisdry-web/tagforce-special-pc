name: C# validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Dependency locks and PSP reference fixtures remain local.
      - name: Restore the C# solution
        run: dotnet restore ygo-tag-force-special-decomp.slnx -p:RestorePackagesWithLockFile=false
      - name: Build the engine, tools and PC host
        run: dotnet build ygo-tag-force-special-decomp.slnx --no-restore -p:IncludeReferenceFixtures=false
      - name: Test C# behavior without local reference fixtures
        run: >-
          dotnet test ygo-tag-force-special-decomp.slnx --no-build --no-restore
          -p:IncludeReferenceFixtures=false --filter 'Category!=LocalReference'
          --logger 'trx;LogFileName=progress.trx' --results-directory TestResults
      - name: Summarize test results
        if: always()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            'No test results were produced; check the restore, build and test steps.' >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          '## C# test results' >> $env:GITHUB_STEP_SUMMARY
          foreach ($report in $reports) {
            [xml]$results = Get-Content -LiteralPath $report.FullName -Raw
            $counts = $results.TestRun.ResultSummary.Counters
            "Passed: $($counts.passed); failed: $($counts.failed); total: $($counts.total)." >> $env:GITHUB_STEP_SUMMARY
            if ([int]$counts.total -eq 0) { throw 'No tests were discovered.' }
          }
          'Tests requiring local PSP reference fixtures are excluded from CI.' >> $env:GITHUB_STEP_SUMMARY
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
