name: Project progress

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore ygo-tag-force-special-decomp.slnx --locked-mode
      - run: dotnet build ygo-tag-force-special-decomp.slnx --no-restore
      - run: dotnet test ygo-tag-force-special-decomp.slnx --no-build --no-restore --logger 'trx;LogFileName=progress.trx' --results-directory TestResults
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r native/python-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s native -p 'test_*.py'
      - run: dotnet run --project TagForceSpecial.Tools --no-build -- research-check
      - name: Check recorded test counts on PRs
        if: github.event_name == 'pull_request'
        run: dotnet run --project TagForceSpecial.Tools --no-build -- progress --verify-test-counts TestResults/progress.trx
      - name: Regenerate PR progress deterministically
        if: github.event_name == 'pull_request'
        run: dotnet run --project TagForceSpecial.Tools --no-build -- progress
      - name: Refresh test snapshot outside PRs
        if: github.event_name != 'pull_request'
        run: dotnet run --project TagForceSpecial.Tools --no-build -- progress --test-results TestResults/progress.trx
      - run: dotnet run --project TagForceSpecial.Tools --no-build -- progress --check
      - name: Reject stale committed progress on PRs
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
      - name: Publish generated progress report
        uses: actions/upload-artifact@v4
        with:
          name: project-progress
          path: |
            README.md
            docs/STATUS.md
            config/progress.json

  refresh-default-branch:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: progress-refresh-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: project-progress
      - name: Commit refreshed progress if changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add README.md docs/STATUS.md config/progress.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh project progress [skip ci]'
          git push origin "HEAD:$DEFAULT_BRANCH"
